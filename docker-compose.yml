# Volunteertrac — self-contained volunteer time tracking
# Usage:  docker compose up --build   →   http://localhost:8080
services:
  volunteertrac:
    build:
      context: .
      dockerfile: Dockerfile
    image: volunteertrac:latest
    container_name: volunteertrac
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Cache tier — Redis 7 with an LRU eviction policy. The SPA memoizes hot
  # aggregates in-browser (Admin → Deploy shows live stats); this service is
  # the drop-in tier for an API/backend to share the same policy at scale.
  cache:
    image: redis:7-alpine
    container_name: volunteertrac-cache
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
